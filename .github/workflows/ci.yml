name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import nltk; [nltk.download(p) for p in ('punkt', 'punkt_tab', 'stopwords')]"
      - run: pytest -q

  notebook:
    # Runs the Colab notebook top to bottom in QUICK_MODE (needs Hugging Face; takes a few minutes).
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 --output-dir "$RUNNER_TEMP" notebooks/LexFront_Review1.ipynb
