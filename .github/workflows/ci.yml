name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-lock.txt   # exact pins that produced the committed results
      - run: python -c "import nltk; [nltk.download(p) for p in ('punkt', 'punkt_tab', 'stopwords')]"
      - run: pytest -q
      - name: Stored statistics match the committed predictions
        run: |
          python -m experiments.run_stats --results results
          python -m experiments.run_stats --results results/quick
          python -m experiments.run_stats --results results/sensitivity_case
          python -m experiments.run_ablation --stats-only --out results/ablation
          python -m experiments.run_ablation --stats-only --out results/quick/ablation
          python -m experiments.run_bpe --stats-only --out results/bpe
          python -m experiments.run_bpe --stats-only --out results/quick/bpe
          python -m experiments.run_bpe --stats-only --out results/bpe_v32000 --vocab-size 32000
          python -m experiments.run_subword2 --stats-only --out results/subword2
          python -m experiments.run_subword2 --stats-only --out results/quick/subword2
          python -m experiments.run_collection --stats-only --out results/collection
          if [ -f results/large/runs.json ]; then python -m experiments.run_large --stats-only --out results/large; fi
          if [ -f results/boost_sentiment140/runs.json ]; then python -m experiments.run_boost --stats-only --dataset sentiment140 --out results/boost_sentiment140; fi
          git diff --exit-code results
      - name: Generated doc blocks match the committed JSON
        run: |
          python -m experiments.render_docs
          git diff --exit-code
      - name: Notebooks match their generators
        run: |
          python notebooks/make_notebook.py --check
          python notebooks/make_large_notebook.py --check
          python notebooks/make_boost_notebook.py --check

  notebook:
    # Runs the Colab notebook top to bottom in QUICK_MODE with FORCE (every run recomputed; needs Hugging Face).
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q graphviz
      - run: pip install -r requirements-lock.txt   # exact pins that produced the committed results
      - run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 --output-dir "$RUNNER_TEMP" notebooks/LexFront_Review1.ipynb

  colab-simulation:
    # What Colab does: Python 3.12, the compatible ranges of requirements.txt (not the lock), an empty working directory.
    # The notebook is copied out of the checkout, so its first cell has to find or clone the repo itself.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q graphviz
      - run: pip install -r requirements.txt
      - name: Run the notebook from an empty directory (its first cell clones this checkout)
        env:
          LEXFRONT_REPO_URL: file://${{ github.workspace }}
        run: |
          mkdir "$RUNNER_TEMP/empty" && cp notebooks/LexFront_Review1.ipynb "$RUNNER_TEMP/empty/"
          cd "$RUNNER_TEMP/empty"
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 --output out.ipynb LexFront_Review1.ipynb

  large-dry-run:
    # The Colab notebook for the Sentiment140 test, run as a small dry run (LEXFRONT_LARGE_QUICK=1) from an empty directory with
    # Colab-like settings (Python 3.12, requirements.txt ranges): the same cells the real run uses, so a bug shows here and not hours in.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run LexFront_Large.ipynb in quick mode from an empty directory
        env:
          LEXFRONT_REPO_URL: file://${{ github.workspace }}
          LEXFRONT_LARGE_QUICK: "1"
        run: |
          mkdir "$RUNNER_TEMP/empty" && cp notebooks/LexFront_Large.ipynb "$RUNNER_TEMP/empty/"
          cd "$RUNNER_TEMP/empty"
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1500 --output out.ipynb LexFront_Large.ipynb

  boost-dry-run:
    # The Colab notebook of a phase D dataset as a small dry run (streamed sample), from an empty directory with Colab-like settings.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dataset: [civil_comments]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run LexFront_Boost_${{ matrix.dataset }}.ipynb in quick mode from an empty directory
        env:
          LEXFRONT_REPO_URL: file://${{ github.workspace }}
          LEXFRONT_BOOST_QUICK: "1"
        run: |
          mkdir "$RUNNER_TEMP/empty" && cp notebooks/LexFront_Boost_${{ matrix.dataset }}.ipynb "$RUNNER_TEMP/empty/"
          cd "$RUNNER_TEMP/empty"
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=2400 --output out.ipynb LexFront_Boost_${{ matrix.dataset }}.ipynb
